server {
  listen 80;
  root /usr/share/nginx/html;
  # privacy: no access log (requests may carry an address in the geocoder query)
  access_log off;
  location /api/ {
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
  }
  # a missing asset must be a 404, not index.html (otherwise a missing worker fails silently)
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
    location ~ \.mjs$ {
      types { }
      default_type text/javascript;
      add_header Cache-Control "public, max-age=31536000, immutable";
    }
  }
  location / {
    try_files $uri /index.html;
  }
}
