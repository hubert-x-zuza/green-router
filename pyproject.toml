[project]
name = "zdrowa-trasa"
version = "0.0.1"
description = "Zdrowa Trasa - healthier routes for Kraków (Open Data App)"
requires-python = ">=3.11"
dependencies = [
  "numpy",
  "pandas",
  "pyarrow",
  "scipy",
  "rasterio",
  "geopandas",
  "shapely>=2",
  "pyproj",
  "osmnx>=2",
  "python-igraph",
  "pillow",
  "httpx",
  "pyyaml",
  "fastapi",
  "uvicorn[standard]",
  "pydantic>=2",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "black", "pre-commit"]

[tool.setuptools]
packages = ["etl", "etl.fetch", "api"]

[tool.pytest.ini_options]
testpaths = ["tests", "api/tests"]
addopts = "-q"

[tool.black]
line-length = 100
extend-exclude = "etl/noise_to_grid.py"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["etl/noise_to_grid.py"]  # tested upstream, kept verbatim

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
