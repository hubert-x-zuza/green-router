  gtfs: {title: "GTFS Kraków", provider: "Zarząd Transportu Publicznego w Krakowie", url: "https://gtfs.ztp.krakow.pl/", status: "listing verified; TODO licence/terms"}
  residents: {title: "Mieszkańcy zameldowani na pobyt stały (31.12.2025)", provider: "Gmina Miejska Kraków, otwartedane.um.krakow.pl", page: "https://otwartedane.um.krakow.pl/zbiory-danych/mieszkancy-zameldowani-na-pobyt-staly", aggregation: "district x sex x birth year (safe, already published)", date_obtained: "2026-10-13", status: "verified 2026-10-13; used for children (0-14) and seniors (65+) per district", citation_pl: "Źródło: Gmina Miejska Kraków, otwartedane.um.krakow.pl, „Mieszkańcy zameldowani na pobyt stały” (stan na 31.12.2025), pozyskane 2026-10-13."}

