# data/manifest.yml
# One entry per external dataset. This file feeds (1) the "About data" panel in the UI,
# (2) the technical documentation, (3) the citation requirements.
# Rules: never invent values. Use `status` to say what is verified. Fill TODOs from the real source.
# Licence note (team, 11 Oct 2026): city resources may be used provided the source is cited.
# Keep the exact regulamin wording in docs/licences/ (screenshot or quoted text + URL + date).

project:
  internal_crs: "EPSG:2178"        # all city data arrives in 2178 (green layer reports ESRI:102176 = same CS2000 zone 7)
  web_crs: "EPSG:4326"
  coverage: "Kraków city boundary + ~500 m buffer"
  date_obtained_default: "2026-10-11"

datasets:

  noise_2022:
    title: "Mapy hałasu 2022 (imisja: drogi, szyny; wskaźniki LDWN i LN)"
    provider: "Gmina Miejska Kraków, Miejski System Informacji Przestrzennej (MSIP)"
    catalogue_page: "https://msip.krakow.pl/dataset/1361"
    service: "https://msip.um.krakow.pl/arcgis/rest/services/Mapa_halasu_2022"
    files_used:
      - halas_2022_imisja_dr_LDWN.geojson      # road, polygons by dB class
      - halas_2022_imisja_dr_LN.geojson
      - halas_2022_imisja_szyn_LDWN.geojson    # rail + tram
      - halas_2022_imisja_szyn_LN.geojson
    files_ignored:
      - "*_izofony.geojson (isolines, redundant)"
      - "*_przem_*.geojson (industry; export has no geometry)"
    crs: "EPSG:2178"
    data_year: 2022
    files_generated: "2026-03-23"      # __Aktualnosc__.txt says 2026-03-23_14:47:00 (a second copy, "__Aktualnosc__ 2.txt", says 14:41:00)
    date_obtained: "2026-10-11"
    status: "verified; grids rebuilt 2026-10-11 by etl/noise_to_grid.py (LDWN 63.1 % at floor, LN 70.9 %)"
    attributes: "isov1, isov2 (dB class bounds), nazwa (district), objectid"
    limitations:
      - "Road classes are 5 dB wide; about two thirds of the city is in the lowest class."
      - "TODO: check metadata for which roads were modelled."
      - "Strategic noise map (modelled), not live noise."
    citation_pl: "Źródło: Gmina Miejska Kraków, MSIP, „Mapy hałasu 2022”, dane pozyskane 2026-10-11 (pliki wygenerowane 2026-03-23)."

  green_map:
    title: "Mapa zieleni (zieleń wysoka / niska / sportowa)"
    provider: "Gmina Miejska Kraków, MSIP"
    layer_url: "https://msip.um.krakow.pl/arcgis/rest/services/MONIT-AIR/WS_MA_Atlas_02_mapa_zieleni_przewietrzania_Krakowa/MapServer/7"
    portal_item_id: "ffc310c95ea74ed388d94cf5d9c4b49d"
    geometry: "polygon"
    source_crs: "ESRI:102176 (ETRS_1989_UWPP_2000_PAS_7, same projection as EPSG:2178)"
    request_out_sr: 2178
    fields: [class_name, area_ha, objectid]
    classes_seen_in_renderer: ["200 Zieleń wysoka", "300 Zieleń niska", "400 Zieleń sportowa, ogródki działkowe"]
    paging: {max_record_count: 1000, order_by: objectid}
    status: "found; TODO confirm layer id (JSON said id 0, URL ends /7), distinct class values, data date"
    data_date: "TODO"
    date_obtained: "TODO"
    todo:
      - "List other layers of the service and the MONIT-AIR folder (possible ventilation/air-flow layer)."
    citation_pl: "TODO: Źródło: Gmina Miejska Kraków, MSIP, „Mapa zieleni”, dane z <data>, pozyskane <data>."

